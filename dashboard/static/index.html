<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PredatorAI Dashboard</title>

<link rel="stylesheet"
      href="/static/style.css">

</head>

<body>

<h1>PredatorAI — Cyber Reasoning Platform</h1>

<div class="kpi-grid">

    <div class="card">

        <h3>Total Findings</h3>

        <h2 id="total">0</h2>

    </div>

    <div class="card">

        <h3>Critical</h3>

        <h2 id="critical">0</h2>

    </div>

    <div class="card">

        <h3>High</h3>

        <h2 id="high">0</h2>

    </div>

    <div class="card">

        <h3>Medium</h3>

        <h2 id="medium">0</h2>

    </div>

    <div class="card">

        <h3>Low</h3>

        <h2 id="low">0</h2>

    </div>

</div>

<hr>

<h2>Highest Risk Decision</h2>

<div
    id="highestRisk"
    class="card">

Loading...

</div>

<hr>

<h2>PredatorAI Decisions</h2>

<table>

<thead>

<tr>

<th>Finding</th>

<th>Priority</th>

<th>Risk Score</th>

<th>Action</th>

</tr>

</thead>

<tbody id="findingsTable">

</tbody>

</table>

<hr>

<h2>Graph Summary</h2>

<pre id="graphSummary"></pre>

<hr>

<h2>Team Risk</h2>

<pre id="teamRisk"></pre>

<hr>

<h2>Story Bundles</h2>

<pre id="storyBundles"></pre>

<hr>

<h2>Reports</h2>

<pre id="reports"></pre>

<script src="/static/app.js"></script>

</body>

</html>
